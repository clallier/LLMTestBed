[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "llm-testbed"
version = "0.1.0"
description = "Modular LLM Security Testbed"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic",
    "streamlit",
    "python-dotenv",
    "langfuse",
    "pytest",
    "pytest-asyncio",
    "respx",
    "watchdog",
    "scikit-learn",
    "rapidfuzz",
    "joblib"
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pylint",
    "radon",
    "bandit",
    "pyright"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pyright]
extraPaths = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "S"]
# E501: Line too long (allows long natural-language prompts and base64 security templates)
# B007: Unused loop variable (allows descriptive unpacking variables in dictionary iterations)
ignore = ["E501", "B007"]
