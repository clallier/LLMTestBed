[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "llm-testbed"
version = "0.1.0"
description = "Modular LLM Security Testbed"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic",
    "streamlit",
    "python-dotenv",
    "langfuse",
    "pytest",
    "pytest-asyncio",
    "respx",
    "watchdog",
    "scikit-learn",
    "rapidfuzz",
    "joblib",
    "json-repair"
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pylint",
    "radon",
    "bandit",
    "pyright"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pyright]
extraPaths = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E: Pycodestyle (Style), F: Pyflakes (Bugs), B: Bugbear (Smells), I: Isort (Imports), S: Bandit (Security), 
# ISC: Implicit String Concatenation, PLC0415: import-outside-toplevel
select = ["E", "F", "B", "I", "S", "ISC", "PLC0415"]
# E501: Line too long (allows long natural-language prompts and base64 security templates)
# B007: Unused loop variable (allows descriptive unpacking variables in dictionary iterations)
ignore = ["E501", "B007"]

[tool.ruff.lint.per-file-ignores]
# S101: Allow standard pytest assert assertions in the test suite
# S603: Allow spawning of Python/uvicorn background processes in test setup fixtures
# S607: Allow starting test runner subprocesses with partial executable paths
"tests/**" = ["S101", "S603", "S607"]
# PLC0415: Allow local imports in AppTest runner wrappers
# F811: Allow redefinition of imports in AppTest wrappers
"tests/**/utils_*.py" = ["PLC0415", "F811"]


